<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5A3D2B" />
  <title>Offline</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f7f7f7; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 24px; }
    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 8px 18px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; color: #444; font-size: 14px; line-height: 1.45; }
    .btn { display: inline-block; margin-top: 14px; background: #5A3D2B; color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Sem conexao</h1>
      <p>Voce esta offline. As paginas acessadas recentemente podem continuar disponiveis. Quando a conexao voltar, o aplicativo sincroniza automaticamente o que estiver pendente.</p>
      <a class="btn" href="/pwa/dashboard">Tentar novamente</a>
    </div>
  </div>
</body>
</html>
