name: EasyPanel Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: easypanel-deploy
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: institutodona_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: institutodona_ci
      DB_USER: root
      DB_PASS: root
      DB_CHARSET: utf8mb4
      APP_BASE_URL: /
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, gd, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Dompdf bootstrap
        run: php app/tests/dompdf_bootstrap_smoke.php
      - name: Apply deploy migration command twice to verify idempotency
        run: |
          composer run deploy:migrate
          composer run deploy:migrate
      - name: Check migration status
        run: php app/tests/migration_runner_status_smoke.php
      - name: Validate resulting schema
        run: php app/tests/migration_schema_validation_smoke.php
      - name: Run focused smoke tests
        run: |
          php app/tests/public_avaliacao_smoke.php
          php app/tests/avaliacao_publica_listing_sync_smoke.php
          php app/tests/avaliacao_publica_no_auth_smoke.php
      - name: Run full test suite
        # Cada app/tests/*.php roda isolado; falha se sair com código != 0 ou
        # imprimir uma linha iniciada por "FAIL". Mostra a saída só dos que falharem
        # e sempre resume o total, para o deploy não seguir com regressões.
        run: |
          set +e
          total=0; falhas=0; lista=""
          for t in app/tests/*.php; do
            total=$((total + 1))
            out=$(timeout 300 php "$t" 2>&1); rc=$?
            if [ $rc -ne 0 ] || printf '%s\n' "$out" | grep -q '^FAIL'; then
              falhas=$((falhas + 1)); lista="$lista\n  - $t (rc=$rc)"
              echo "::group::FAIL $t (rc=$rc)"; printf '%s\n' "$out" | tail -n 40; echo "::endgroup::"
            fi
          done
          echo "Suite: $total arquivos, $((total - falhas)) PASS, $falhas FAIL"
          if [ $falhas -gt 0 ]; then printf "Falharam:$lista\n"; exit 1; fi
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          test -n "${{ secrets.EASYPANEL_DEPLOY_URL }}"
      - name: Trigger EasyPanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          set -e
          curl -fsS -X POST "$EASYPANEL_DEPLOY_URL" || curl -fsS -X GET "$EASYPANEL_DEPLOY_URL"
