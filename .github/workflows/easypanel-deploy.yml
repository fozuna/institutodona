name: EasyPanel Deploy
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EasyPanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if ! curl -fsS -X POST "$EASYPANEL_DEPLOY_URL"; then
            curl -fsS -X GET "$EASYPANEL_DEPLOY_URL"
          fi
